schemaVersion: "2"
kind: mixin
name: bun
displayName: Bun runtime
description: Installs Bun 1.3.13 system-wide for the opencode sandbox.

permissions:
  network:
    allow:
      - bun.sh
      - github.com
      - "**.githubusercontent.com"
      - registry.npmjs.org
      - npmjs.org
      - archive.ubuntu.com
      - security.ubuntu.com

setup:
  install:
    - command: "command -v unzip >/dev/null || (apt-get update && apt-get install -y unzip); curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash -s bun-v1.3.13"
      user: "0"
      description: Install Bun 1.3.13 system-wide
