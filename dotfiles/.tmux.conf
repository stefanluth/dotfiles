unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s

# vim keymaps
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# resize panes
bind-key -r H resize-pane -L 1
bind-key -r J resize-pane -D 1
bind-key -r K resize-pane -U 1
bind-key -r L resize-pane -R 1

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'dracula/tmux'

# resurrect
set -g @resurrect-dir "~/.tmux/resurrect"
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-processes 'off'
set -g @resurrect-save-shell-history 'on'
set -g @resurrect-save-panes 'on'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# continuum
set -g @continuum-restore 'on'

# dracula theme
set -g @dracula-plugins "cpu-usage ram-usage weather battery time"
set -g @dracula-cpu-usage-colors "light_purple dark_gray"
set -g @dracula-ram-usage-colors "green dark_gray"
set -g @dracula-weather-colors "orange dark_gray"
set -g @dracula-battery-colors "cyan dark_gray"
set -g @dracula-time-colors "pink dark_gray"

set -g @dracula-day-month true
set -g @dracula-fixed-location "Naga City"
set -g @dracula-refresh-rate 2
set -g @dracula-battery-label false
set -g @dracula-show-battery-status true
set -g @dracula-show-fahrenheit false
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-show-powerline true
set -g @dracula-show-timezone false
set -g status-position bottom

# Open split/new window in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

run '~/.tmux/plugins/tpm/tpm'
